<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>My Portfolio</title>
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav class="nav-bar">
            <div class="nav-logo">
                <a href="#">
                    <img src="/assets/Logo.png" alt="logo image"
                     title="logo image">
                </a>
            </div>

            <div class="nav-links">
                <ul>
                    <li><a href="">Home</a></li>
                   <li class="highlight-item"><a href="#"
                     class="projects-link">Projects</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Process</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </div>

            <div class="nav-buttons">
                <button class="call-btn">
                    <span>Book a Call</span>
                    <span class="icon-wrap">
                        <img src="/assets/arrow.png" alt="arrow icon" width="16">
                    </span>
                </button>
                <button class="change-bg-mode">
                    <img src="/assets/dark.png" alt="light icon" 
                        width="26">
                </button>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
     <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">I design & develop <br>
                <span class="hero-subtitle">emails that perform.</span>
            </h1>

            <p class="hero-paragraph">
                From figma to inbox. I design and implement 
                responsive a pixel-perfect HTML emails that looks great works across all
                major email clients and drive result.
            </p>

            <div class="nav-buttons">
                <button class="view-work">
                    <span>View My Works</span>
                    <span class="icon-wrap">
                        <img src="/assets/arrow.png" alt="arrow icon" width="16">
                    </span>
                </button>
                <a href="mailto:oteikwuon@gmail.com" class="chat-btn-link">
                <button class="chat-btn">
                <span class="icon-wrap">
                    <img src="/assets/email-icon.png" alt="arrow icon" width="16">
                </span>
                <span>Let’s Work Together</span>
                </button>
                </a>
            </div>
        </div>

        <div class="hero-image">
            <img src="/assets/Hero-image.png" alt="hero image" width="450">
        </div>
     </section>

    <script src="scrpt.js"></script>
</body>
</html>
